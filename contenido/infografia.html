<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reforma educativa</title><style>
*, *::before, *::after { box-sizing: border-box; }
img { max-width: 100%; }
.ig-tabla-envoltura { overflow-x: auto; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
@media print {
  .ig-seccion { break-inside: avoid; }
}

:root {
  color-scheme: light dark;
  --bg: #EDEEF0;
  --celda: #F8F9FA;
  --tinte: #F3DCE3;
  --linea-c: #D9DCE1;
  --acento: #B83A5E;
  --sobre: #FBEFF3;
  --ink: #17181C;
  --ink-2: #4B4E57;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121316;
    --celda: #1B1D22;
    --tinte: #3A1D28;
    --linea-c: #2A2D34;
    --acento: #E0708F;
    --sobre: #2A0F18;
    --ink: #ECEDEF;
    --ink-2: #A5A9B3;
  }
}
body.bento-cuerpo { margin: 0; background: var(--bg); color: var(--ink); font-family: "Geist", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; line-height: 1.55; padding: 12px; }
.ig-hero, .ig-cuerpo { width: min(1200px, 100%); margin: 0 auto; }
.ig-hero__interior { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.ig-hero__texto { grid-column: span 8; background: var(--acento); color: var(--sobre); border-radius: 20px; padding: clamp(1.25rem, 3vw, 2.5rem); display: flex; flex-direction: column; justify-content: flex-end; min-height: 320px; }
.ig-hero__imagen { grid-column: span 4; width: 100%; height: 100%; min-height: 320px; object-fit: cover; border-radius: 20px; display: block; }
.ig-fecha { margin: 0 0 1rem; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.ig-titulo { margin: 0; font-weight: 700; letter-spacing: -0.035em; line-height: 1.04; font-size: clamp(1.9rem, 4.4vw, 3.6rem); }
.ig-subtitulo { margin: 1rem 0 0; font-size: clamp(1rem, 1.4vw, 1.2rem); max-width: 46ch; }
.ig-cuerpo { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; padding-bottom: 5rem; align-items: start; }
.ig-seccion { border-radius: 20px; padding: clamp(1rem, 2.4vw, 2rem); background: var(--celda); border: 1px solid var(--linea-c); animation: aparece 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: calc(var(--n) * 70ms); }
.ig-seccion--resumen { grid-column: span 5; background: var(--tinte); border-color: transparent; }
.ig-seccion--lista { grid-column: span 7; }
.ig-seccion--tabla { grid-column: span 12; }
.ig-seccion--resumen:nth-child(3n) { grid-column: span 7; background: var(--celda); border-color: var(--linea-c); }
@keyframes aparece { from { opacity: 0; transform: scale(0.97); } }
.ig-h2 { margin: 0 0 1rem; font-size: clamp(1.2rem, 2vw, 1.7rem); font-weight: 700; letter-spacing: -0.03em; }
.ig-texto { margin: 0; font-size: clamp(1.1rem, 1.9vw, 1.55rem); letter-spacing: -0.015em; line-height: 1.35; }
.ig-lineas { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.9rem; font-size: clamp(1rem, 1.4vw, 1.15rem); }
.ig-sublineas { list-style: none; margin: 0.5rem 0 0; padding: 0 0 0 1.25rem; display: grid; gap: 0.35rem; color: var(--ink-2); font-size: 0.92em; }
.ig-tabla { width: 100%; border-collapse: collapse; }
.ig-tabla th { text-align: left; padding: 0.6rem 0.8rem; background: var(--tinte); }
.ig-tabla td { padding: 0.6rem 0.8rem; border-top: 1px solid var(--linea-c); vertical-align: top; }
.ig-pie { width: min(1200px, 100%); margin: 0 auto; padding: 0 0.5rem 3rem; color: var(--ink-2); font-size: 0.85rem; }
@media (max-width: 767px) {
  .ig-hero__interior, .ig-cuerpo { grid-template-columns: minmax(0, 1fr); }
  .ig-hero__texto, .ig-hero__imagen, .ig-seccion--resumen, .ig-seccion--lista, .ig-seccion--tabla, .ig-seccion--resumen:nth-child(3n) { grid-column: auto; }
  .ig-hero__imagen { min-height: 200px; }
}
</style></head><body class="bento-cuerpo"><header class="ig-hero"><div class="ig-hero__interior"><div class="ig-hero__texto"><h1 class="ig-titulo">Reforma educativa</h1><p class="ig-subtitulo">Resumen del periodo</p></div></div></header><main class="ig-cuerpo"><section class="ig-seccion ig-seccion--resumen" style="--n:0"><h2 class="ig-h2">Contexto</h2><p class="ig-texto">Texto del contexto.</p></section><section class="ig-seccion ig-seccion--lista" style="--n:1"><h2 class="ig-h2">Puntos</h2><ul class="ig-lineas"><li class="ig-linea">Uno<ul class="ig-sublineas"><li>Sub uno</li><li>Sub dos</li></ul></li><li class="ig-linea">Dos</li></ul></section><section class="ig-seccion ig-seccion--tabla" style="--n:2"><h2 class="ig-h2">Datos</h2><div class="ig-tabla-envoltura"><table class="ig-tabla"><thead class=""><tr class=""><th class="" scope="col">Nombre</th><th class="" scope="col">Valor</th></tr></thead><tbody class=""><tr class=""><td class="">x</td><td class="">1</td></tr></tbody></table></div></section></main><footer class="ig-pie"><p>Fuente de prueba</p></footer><script></script><script type="module"></script></body></html>
